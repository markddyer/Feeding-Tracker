# XcodeGen spec. Generate the project with `xcodegen generate`; never hand-edit Feeding.xcodeproj.
#
# Two variants, installable side by side:
# - Feeding: TestFlight, CloudKit Production, the real data.
# - FeedingDev: spikes and testing, with its own bundle ID, iCloud container and App Group.
#
# Your Apple team ID goes in Config/Local.xcconfig (not committed; copy Config/Local.xcconfig.example).

name: Feeding

options:
  bundleIdPrefix: com.tracker
  deploymentTarget:
    iOS: "27.1"
    watchOS: "27.0"
  developmentLanguage: en-GB
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FeedingCore:
    path: FeedingCore
  # Claude for the AI insights' cards (docs/planning/12-ai-insights-gauntlet.md, D2, step 2 S7):
  # the one outside library the project allows, pinned exactly while it is in beta; moved on only
  # by choice, with the model tests run after a move.
  ClaudeForFoundationModels:
    url: https://github.com/anthropics/ClaudeForFoundationModels.git
    exactVersion: 0.2.3

targetTemplates:
  FeedingApp:
    type: application
    platform: iOS
    sources:
      - path: App
      # Shared with the widget extension: the quick feed actions and the Lock Screen widget's view.
      - path: Shared
    dependencies:
      - package: FeedingCore
      # The AI insights' parts (docs/planning/12-ai-insights-gauntlet.md, R1): only the app uses them.
      - package: FeedingCore
        product: FeedingInsights
      - package: ClaudeForFoundationModels
      - target: ${widgets}
        embed: true
      # The watch app, installed on the paired watch with the phone app.
      - target: ${watch}
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.feeding${bundleSuffix}
        PRODUCT_NAME: ${target_name}
        # AppIcon, or AppIcon-Dev (with a "DEV" band) for Feeding Dev. Both are made by
        # tools/make-app-icons.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: ${appIcon}
        # The simulator's development key for Claude, from the gitignored Config/Local.xcconfig
        # (CLAUDE_DEV_API_KEY). Only simulator builds carry it; a phone build has none and uses App
        # Attest (step 2 S6).
        CLAUDE_DEV_API_KEY_SIMULATOR: ""
        "CLAUDE_DEV_API_KEY_SIMULATOR[sdk=iphonesimulator*]": $(CLAUDE_DEV_API_KEY)
    info:
      path: Generated/${target_name}/Info.plist
      properties:
        CFBundleDisplayName: ${displayName}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The launch screen stays dark in both looks: it can't know the time, and a light flash
        # at night is worse than a dark one by day. The app picks its own look (LookModifier).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Fredoka, for headings and buttons (DESIGN.md). Its licence is App/Fonts/Fredoka-OFL.txt.
        UIAppFonts:
          - Fredoka.ttf
        # All four: the Duo's inner display and Split View resize the app whatever it lists, and
        # Xcode warns unless every orientation is supported.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        CKSharingSupported: true
        # Only Apple's own encryption (iCloud's HTTPS and CloudKit's encrypted fields), which is
        # exempt: TestFlight then doesn't ask the export question at each upload.
        ITSAppUsesNonExemptEncryption: false
        NSAlarmKitUsageDescription: Little Log rings an alarm when the feed window you set closes, even when the phone is on silent.
        NSCameraUsageDescription: Little Log takes a photo or video of a first for your journal, when you choose to.
        NSMicrophoneUsageDescription: Little Log records the sound of a video you take of a first, when you choose to.
        NSPhotoLibraryAddUsageDescription: Little Log keeps a copy of a photo you take in the app in your Photos.
        FeedingCloudKitContainer: iCloud.com.tracker.feeding${bundleSuffix}
        FeedingAppGroup: group.com.tracker.feeding${bundleSuffix}
        # The Claude Console's App Attest client ID (Config/Local.xcconfig, CLAUDE_CLIENT_ID), and
        # the simulator-only development key (empty in a phone build).
        ClaudeClientID: $(CLAUDE_CLIENT_ID)
        ClaudeDevAPIKey: $(CLAUDE_DEV_API_KEY_SIMULATOR)
        # "Export the journal" carries on in the background (a continued-processing task, iOS 26;
        # journal eng D4). Each export submits its own ID under this one.
        BGTaskSchedulerPermittedIdentifiers:
          - com.tracker.feeding${bundleSuffix}.export.*
    # AlarmKit needs no entitlement. Never add one: a made-up entitlement breaks signing.
    entitlements:
      path: Generated/${target_name}/${target_name}.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.tracker.feeding${bundleSuffix}
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.tracker.feeding${bundleSuffix}
        com.apple.developer.usernotifications.time-sensitive: true
        # App Attest, for the AI insights' calls to Claude with no key in the app (D2). Production
        # in both variants: TestFlight always uses it, and builds installed from Xcode then attest
        # the same way (step 2 S10). A real entitlement, unlike AlarmKit's.
        com.apple.developer.devicecheck.appattest-environment: production
    scheme: {}

  # The Lock Screen widget and the Control Center control (plan v1, Phase 2). They only read the
  # household file in the App Group; the start and finish actions run in the app's own process
  # (Shared/FeedIntents.swift), so the extension needs no iCloud and no AlarmKit.
  FeedingWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: FeedingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.feeding${bundleSuffix}.widgets
        PRODUCT_NAME: ${target_name}
        SKIP_INSTALL: YES
        # Marks the extension's copy of the shared actions, whose bodies never run there.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FEEDING_WIDGETS
    info:
      path: Generated/${target_name}/Info.plist
      properties:
        CFBundleDisplayName: ${displayName}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FeedingAppGroup: group.com.tracker.feeding${bundleSuffix}
    entitlements:
      path: Generated/${target_name}/${target_name}.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tracker.feeding${bundleSuffix}

  # The Apple Watch app (plan v1, Phase 2). It talks only to its own iPhone over
  # WatchConnectivity (no iCloud of its own), and keeps what it last heard in the watch's App
  # Group for the watch face.
  FeedingWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Watch/App
      - path: Watch/Shared
      - path: Shared/GlanceText.swift
      - path: Shared/FeedShapes.swift
      - path: Shared/WindowSteps.swift
      # Siri's lists and words, the same as the phone's (docs/planning/15-hands-free-siri.md).
      - path: Shared/SiriChoices.swift
      - path: Shared/SiriText.swift
      - path: App/Fonts/Fredoka.ttf
    dependencies:
      - package: FeedingCore
      - target: ${watchWidgets}
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.feeding${bundleSuffix}.watchkitapp
        PRODUCT_NAME: ${target_name}
        TARGETED_DEVICE_FAMILY: "4"
        # From Watch/App/Assets.xcassets: the phone's picture, made for the watch's round icon by
        # tools/make-app-icons.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: ${appIcon}
    info:
      path: Generated/${target_name}/Info.plist
      properties:
        CFBundleDisplayName: ${displayName}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.tracker.feeding${bundleSuffix}
        UIAppFonts:
          - Fredoka.ttf
        FeedingAppGroup: group.com.tracker.feeding${bundleSuffix}
        # The watch face's Start feed opens the app with this link (Watch/Shared/WatchFile.swift).
        FeedingWatchScheme: com.tracker.feeding${bundleSuffix}.watch
        CFBundleURLTypes:
          - CFBundleURLName: com.tracker.feeding${bundleSuffix}.watch
            CFBundleURLSchemes:
              - com.tracker.feeding${bundleSuffix}.watch
    entitlements:
      path: Generated/${target_name}/${target_name}.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tracker.feeding${bundleSuffix}
    scheme: {}

  # The watch face pieces. They read only the watch app's file in the watch's App Group.
  FeedingWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Watch/Widgets
      - path: Watch/Shared
      - path: Shared/GlanceText.swift
      - path: Shared/FeedShapes.swift
      - path: Shared/WindowSteps.swift
    dependencies:
      - package: FeedingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.feeding${bundleSuffix}.watchkitapp.widgets
        PRODUCT_NAME: ${target_name}
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Generated/${target_name}/Info.plist
      properties:
        CFBundleDisplayName: ${displayName}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FeedingAppGroup: group.com.tracker.feeding${bundleSuffix}
        FeedingWatchScheme: com.tracker.feeding${bundleSuffix}.watch
    entitlements:
      path: Generated/${target_name}/${target_name}.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tracker.feeding${bundleSuffix}

targets:
  Feeding:
    templates: [FeedingApp]
    templateAttributes:
      bundleSuffix: ""
      displayName: Little Log
      appIcon: AppIcon
      widgets: FeedingWidgets
      watch: FeedingWatch
  FeedingDev:
    templates: [FeedingApp]
    templateAttributes:
      bundleSuffix: .dev
      displayName: Test Log
      appIcon: AppIcon-Dev
      widgets: FeedingDevWidgets
      watch: FeedingDevWatch
    settings:
      base:
        # Turns on the Phase 0 test screens (App/Spikes), which never ship in Feeding.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FEEDING_DEV
    scheme:
      testTargets: [FeedingAppTests]

  FeedingWidgets:
    templates: [FeedingWidgets]
    templateAttributes:
      bundleSuffix: ""
      displayName: Little Log
  FeedingDevWidgets:
    templates: [FeedingWidgets]
    templateAttributes:
      bundleSuffix: .dev
      displayName: Test Log

  FeedingWatch:
    templates: [FeedingWatchApp]
    templateAttributes:
      bundleSuffix: ""
      displayName: Little Log
      appIcon: AppIcon
      watchWidgets: FeedingWatchFaceWidgets
  FeedingDevWatch:
    templates: [FeedingWatchApp]
    templateAttributes:
      bundleSuffix: .dev
      displayName: Test Log
      appIcon: AppIcon-Dev
      watchWidgets: FeedingDevWatchFaceWidgets
    settings:
      base:
        # Turns on the made-up states for screenshots (Watch/App/WatchSamples.swift).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FEEDING_DEV

  FeedingWatchFaceWidgets:
    templates: [FeedingWatchWidgets]
    templateAttributes:
      bundleSuffix: ""
      displayName: Little Log
  FeedingDevWatchFaceWidgets:
    templates: [FeedingWatchWidgets]
    templateAttributes:
      bundleSuffix: .dev
      displayName: Test Log

  # Tests of the app's Apple-only parts (CloudKit record mapping and the like), run in the
  # simulator: xcodebuild test -scheme FeedingDev -destination 'platform=iOS Simulator,name=iPhone 18 Pro'
  # Apple's accessibility audit on every screen, in both looks and at a large text size
  # (UITests/AccessibilityAuditTests.swift). A report, not a gate: some of its notes are noise
  # (text scrolled under the pinned buttons), so a person reads them. Run with the FeedingDevAudit
  # scheme: xcodebuild test -scheme FeedingDevAudit -destination 'platform=iOS Simulator,name=iPhone 18 Pro'.
  # It also holds tap tests of the night ask (UITests/NightAskFlowTests.swift).
  FeedingDevUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FeedingDev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.feeding.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FeedingDev

  FeedingAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: FeedingDev
      - package: FeedingCore
      - package: FeedingCore
        product: FeedingInsights
      - package: ClaudeForFoundationModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.feeding.dev.tests
        GENERATE_INFOPLIST_FILE: YES

  # AI13's model tests (docs/planning/12-ai-insights-gauntlet.md, step 2 D7 C): 30 made-up
  # households, each made into a card by the real model with the simulator's development key. It
  # costs money, so it is never part of another scheme's test run. Run before each TestFlight
  # upload and after any change of model or package, with the FeedingDevModelTests scheme.
  FeedingModelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ModelTests
      - path: FeedingCore/Tests/FeedingInsightsTests/Fixtures/households
    dependencies:
      - target: FeedingDev
      - package: FeedingCore
      - package: FeedingCore
        product: FeedingInsights
      - package: ClaudeForFoundationModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.feeding.dev.modeltests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FeedingDevModelTests:
    build:
      targets:
        FeedingDev: all
        FeedingModelTests: [test]
    test:
      config: Debug
      targets: [FeedingModelTests]
  FeedingDevAudit:
    build:
      targets:
        FeedingDev: all
        FeedingDevUITests: [test]
    test:
      config: Debug
      targets: [FeedingDevUITests]
