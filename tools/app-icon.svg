<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- The app icon's picture (17 Nov 2026, the user's choice): the baby's head on coral.
       It is picture N on colour G from round six of the icon ideas
       (app-icon-20261116/feeding-icon-choices.html in the gstack design folder).
       Make the icons from it with: swift tools/make-app-icons.swift tools/app-icon.svg -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9C7F"/><stop offset="1" stop-color="#FF8763"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".08" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="face" cx=".42" cy=".34" r=".75">
      <stop offset="0" stop-color="#FFF7EC"/><stop offset="1" stop-color="#F9CDA6"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.4" flood-color="#5A2412" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#wall)"/>
  <rect width="100" height="100" fill="url(#glow)"/>
  <g transform="translate(50 54.7) scale(1.22) translate(-50 -55)">
    <g filter="url(#shadow)">
      <circle cx="24.5" cy="55" r="6.2" fill="url(#face)"/>
      <circle cx="75.5" cy="55" r="6.2" fill="url(#face)"/>
      <circle cx="50" cy="55" r="27" fill="url(#face)"/>
    </g>
    <circle cx="24.5" cy="55" r="2.8" fill="#F2B391"/>
    <circle cx="75.5" cy="55" r="2.8" fill="#F2B391"/>
    <path d="M50 28.6C46.6 24.4 49.4 19.6 54 20.6C57.8 21.6 57.4 26.6 53.8 26.4" stroke="#8A5536" stroke-width="2.9" stroke-linecap="round" fill="none"/>
    <path d="M36.5 56Q41 60.6 45.5 56M54.5 56Q59 60.6 63.5 56" stroke="#5A3A26" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <ellipse cx="36" cy="64.5" rx="4.8" ry="3.2" fill="#FF7E5F" opacity=".38"/>
    <ellipse cx="64" cy="64.5" rx="4.8" ry="3.2" fill="#FF7E5F" opacity=".38"/>
    <path d="M47 68.4Q50 70.8 53 68.4" stroke="#5A3A26" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
