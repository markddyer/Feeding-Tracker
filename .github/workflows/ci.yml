name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This repository is public, so every job runs on GitHub's own machines (free for public
# repositories). Never point it at a self-hosted runner: anyone could run code on that machine.
jobs:
  core-linux:
    name: FeedingCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: swift test
        run: swift test --package-path FeedingCore

  apple:
    name: FeedingCore tests (macOS) and app builds
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - name: swift test
        run: swift test --package-path FeedingCore
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build Feeding
        run: xcodebuild build -project Feeding.xcodeproj -scheme Feeding -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Build Feeding Dev
        run: xcodebuild build -project Feeding.xcodeproj -scheme FeedingDev -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
