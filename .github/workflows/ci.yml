name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This repository is public, so every job runs on GitHub's own machines (free for public
# repositories). Never point it at a self-hosted runner: anyone could run code on that machine.
jobs:
  core-linux:
    name: FeedingCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: swift test
        run: swift test --package-path FeedingCore

  apple:
    name: FeedingCore tests (macOS) and app builds
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - name: swift test
        run: swift test --package-path FeedingCore
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build Feeding
        run: xcodebuild build -project Feeding.xcodeproj -scheme Feeding -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Build Feeding Dev
        run: xcodebuild build -project Feeding.xcodeproj -scheme FeedingDev -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

  # The app's own tests in the simulator (journal plan, task T12): AppTests (record mapping, the
  # schema check, the design tokens, the photo and Undo rules) and the History delete tap test.
  # Signed "to run locally" with no team: no Apple account is needed in the simulator.
  app-tests:
    name: App tests (simulator)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SIGNING: DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual
    steps:
      - uses: actions/checkout@v7
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Choose a simulator
        # The iPhone 18 Pro the tests are written on, or else the newest iOS's first iPhone.
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(key):
              m = re.search(r"iOS-(\d+)-(\d+)", key)
              return (int(m[1]), int(m[2])) if m else (0, 0)
          ios = sorted((k for k in runtimes if ".iOS-" in k), key=version, reverse=True)
          # Not the Duo: its own runtime, and most tests are written for one screen.
          phones = [d for k in ios for d in runtimes[k] if d["name"].startswith("iPhone") and "Duo" not in d["name"]]
          pick = next((d for d in phones if d["name"] == "iPhone 18 Pro"), phones[0])
          print(pick["udid"])')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$SIM"
      - name: App tests
        run: xcodebuild test -project Feeding.xcodeproj -scheme FeedingDev -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath build $SIGNING
      - name: History tap test
        run: xcodebuild test -project Feeding.xcodeproj -scheme FeedingDevAudit -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath build -only-testing:FeedingDevUITests/HistoryDeleteFlowTests $SIGNING
